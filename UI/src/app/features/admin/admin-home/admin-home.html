<section class="admin-home sbi-container" [attr.aria-labelledby]="headingId">
  <div class="admin-home__header">
    <div class="admin-home__intro">
      <p
        class="sbi-label admin-home__eyebrow"
        i18n="Admin home eyebrow|Identifies the protected admin area@@adminHomeEyebrow"
      >
        Admin area
      </p>
      <h1
        i18n="Admin home heading|Main heading for the protected admin landing page@@adminHomeHeading"
        tabindex="-1"
        [id]="headingId"
      >
        Admin tools
      </h1>
      <p class="admin-home__body" i18n="Admin home body|Confirms authenticated admin access@@adminHomeBody">
        You're signed in. Admin workflows will appear here as they become available.
      </p>
    </div>

    <button
      class="admin-home__sign-out"
      type="button"
      [disabled]="$isSigningOut()"
      [attr.aria-busy]="$isSigningOut()"
      (click)="signOut()"
    >
      @if ($isSigningOut()) {
        <span
          i18n="Admin home pending sign out button|Button text while sign-out is in progress@@adminHomePendingSignOut"
        >
          Signing out...
        </span>
      } @else {
        <span i18n="Admin home sign out button|Signs the current admin out@@adminHomeSignOut">Sign out</span>
      }
    </button>
  </div>

  @if ($errorMessage(); as errorMessage) {
    <p #errorSummary class="admin-home__error" id="admin-home-sign-out-error" role="alert" tabindex="-1">
      {{ errorMessage }}
    </p>
  }

  <div
    class="admin-home__placeholder"
    i18n="
      Admin home placeholder|Reserves space for future admin workflows without exposing unfinished
      controls@@adminHomePlaceholder"
  >
    Protected admin access is ready. The next tools will be added here when they are available.
  </div>
</section>
