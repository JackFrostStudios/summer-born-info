<section class="not-found sbi-container" [attr.aria-labelledby]="headingId">
  <sbi-panel class="not-found__panel">
    <sbi-not-found-icon panelMedia class="not-found__icon" />

    <p class="sbi-label not-found__eyebrow" i18n="Not-found eyebrow|Introduces the missing page state@@notFoundEyebrow">
      Page not found
    </p>
    <h1
      i18n="Not-found heading|Explains that the requested page could not be found@@notFoundHeading"
      tabindex="-1"
      [id]="headingId"
    >
      We can't find this page
    </h1>
    <p
      class="not-found__body"
      i18n="
        Not-found body|Explains that the destination does not exist and invites the visitor back to the
        homepage@@notFoundBody"
    >
      The link may be out of date, or the address may have a typo. You can go back to the homepage and keep using the
      guidance from there.
    </p>
    <sbi-button
      class="not-found__home-button"
      i18n="Not-found home button|Takes the visitor back to the homepage@@notFoundHomeButton"
      (pressed)="goHome()"
    >
      Go to the homepage
    </sbi-button>
  </sbi-panel>
</section>
