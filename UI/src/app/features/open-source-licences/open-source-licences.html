<article class="open-source-licences sbi-container sbi-readable" [attr.aria-labelledby]="headingId">
  <header class="open-source-licences__header">
    <p
      class="sbi-label open-source-licences__eyebrow"
      i18n="Open-source licences eyebrow|Introduces the licensing information page@@openSourceLicencesEyebrow"
    >
      Site notices
    </p>
    <h1
      i18n="Open-source licences heading|Names the open source licensing information page@@openSourceLicencesHeading"
      tabindex="-1"
      [id]="headingId"
    >
      Open source licences
    </h1>
  </header>

  <div class="open-source-licences__content">
    <p
      i18n="
        Open-source licences package notice|Explains that the UI publishes bundled third-party package
        notices@@openSourceLicencesPackageNotice"
    >
      This site is built using open source software. Below is a list of the third-party packages we use and their
      licence notices.
    </p>

    <p>
      <a
        class="open-source-licences__notice-link"
        href="/3rdpartylicenses.txt"
        i18n="
          Open-source licences generated notices link|Opens the generated third-party licence notices text
          file@@openSourceLicencesGeneratedNoticesLink"
      >
        View the third-party licence notices
      </a>
    </p>

    <p
      class="open-source-licences__attribution"
      i18n="
        Open-source licences icon attribution|Credits the source of the theme icons on the open source licences
        page@@openSourceLicencesIconAttribution"
    >
      Uicons by <a href="https://www.flaticon.com/uicons">Flaticon</a>
    </p>
  </div>
</article>
