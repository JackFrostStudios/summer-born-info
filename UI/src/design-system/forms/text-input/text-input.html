<label [for]="$inputId()"><ng-content /></label>
<input
  [id]="$inputId()"
  [type]="$type()"
  [attr.autocomplete]="$autocomplete()"
  [formField]="$field()"
  [attr.aria-invalid]="$view().visible"
  [attr.aria-describedby]="$view().aria"
/>
@if ($view().visible && $view().messages.length) {
  <div [id]="`${$inputId()}-error`">
    @for (message of $view().messages; track $index) {
      <p>{{ message }}</p>
    }
  </div>
}
